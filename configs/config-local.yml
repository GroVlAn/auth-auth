http:
  port: '9081'
  max_header_bytes: 1048576
  read_header_timeout: 10s
  write_timeout: 10s
  base_http_path: '/api/v1/auth'

grpc:
  port: '9011'
  user_api_host: 'user'
  user_api_port: '9012'

key_builder:
  prev: 'auth'
  version: 1

settings:
  default_timeout: 15s

redis:
  default_timeout: 15s

middleware:
  allowed_origins:
    - 'https://*'
    - 'http://*'
  allowed_methods:
    - 'GET'
    - 'POST'
    - 'PATCH'
    - 'PUT'
    - 'DELETE'
    - 'OPTIONS'
  allowed_headers:
    - 'Accept'
    - 'Authorization'
    - 'Content-Type'
    - 'X-CSRF-Token'
  allow_credentials: true
  max_age: 300
